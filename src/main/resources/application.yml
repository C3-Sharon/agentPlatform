server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    chat:
      client:
        enabled: false

    model:
      chat: none
      embedding: none
      image: none
      moderation: nome
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen2.5-7B-Instruct
          temperature: 0.7
agent-platform:
  models:
    - id: mock-model
      provider: mock
      display-name: Mock Model
      type: mock
      enabled: true
      capabilities: ["chat"]

    - id: siliconflow-qwen
      display-name: Qwen via SiliconFlow
      provider: siliconflow
      type: openai-compatible
      base-url: https://api.siliconflow.cn
      api-key: ${OPENAI_API_KEY:}
      model-name: Qwen/Qwen2.5-7B-Instruct
      temperature: 0.7
      enabled: true
      capabilities: ["chat", "tool_calling"]

    - id: siliconflow-deepseek
      display-name: DeepSeek via SiliconFlow
      provider: siliconflow
      type: openai-compatible
      base-url: https://api.siliconflow.cn
      api-key: ${OPENAI_API_KEY:}
      model-name: deepseek-ai/DeepSeek-V3.1
      temperature: 0.7
      enabled: true
      capabilities: ["chat", "reasoning"]

    - id: siliconflow-qwen-vl
      display-name: Qwen3 VL 32B via SiliconFlow
      provider: siliconflow
      type: openai-compatible
      base-url: https://api.siliconflow.cn
      model-name: Qwen/Qwen3-VL-32B-Instruct
      api-key: ${OPENAI_API_KEY:}
      enabled: true
      capabilities:
        - chat
        - vision
        - multimodal

    - id: local-ollama
      display-name: Local Ollama Model
      provider: ollama
      type: openai-compatible
      base-url: http://localhost:11434/v1
      model-name: qwen2.5:7b
      enabled: false
      capabilities: ["chat", "local"]
